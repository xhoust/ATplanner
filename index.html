<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tibor & Anna's Hub</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#fcfaf6" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #faf6f0;
      color: #262422;
    }
    .cat-paw-bg {
      background-image: radial-gradient(#e4dacf 1.2px, transparent 1.2px), radial-gradient(#e4dacf 1.2px, #faf6f0 1.2px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
    }
  </style>
</head>
<body class="cat-paw-bg min-h-screen pb-28 selection:bg-orange-200">

  <!-- Decorative Silhouettes -->
  <div class="fixed top-12 -right-8 opacity-10 pointer-events-none select-none text-orange-950 text-8xl -rotate-12 z-0">
    <i class="fa-solid fa-cat"></i>
  </div>
  <div class="fixed bottom-24 -left-6 opacity-10 pointer-events-none select-none text-orange-950 text-7xl rotate-12 z-0">
    <i class="fa-solid fa-paw"></i>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-[#faf6f0]/90 backdrop-blur-md border-b border-orange-100/80 px-5 py-3.5 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-amber-200 via-orange-100 to-amber-50 text-amber-900 flex items-center justify-center font-extrabold text-lg shadow-sm border border-amber-300/50 relative">
          🐾
          <span class="absolute -top-1 -right-1 flex h-3 w-3">
            <span id="sync-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span id="sync-dot" class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
          </span>
        </div>
        <div>
          <h1 class="font-extrabold text-lg tracking-tight text-neutral-900 flex items-center gap-1.5 leading-none">
            Tibor & Anna
          </h1>
          <span id="sync-status" class="text-xs font-semibold text-emerald-700 tracking-wide">all synced up</span>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button id="user-toggle" onclick="toggleUser()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-2xl bg-white shadow-sm border border-orange-200/70 text-xs font-bold text-neutral-800 hover:border-orange-300 transition active:scale-95">
          <span class="text-sm">🐱</span>
          <span id="active-user-label" class="tracking-wide">Tibor</span>
        </button>
        <button onclick="confirmResetWeek()" class="w-9 h-9 rounded-2xl bg-white hover:bg-rose-50 text-neutral-400 hover:text-rose-500 border border-orange-200/70 shadow-sm flex items-center justify-center transition active:scale-90" title="Reset Week Meals (Preserves Events)">
          <i class="fa-solid fa-rotate-right text-xs"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 pt-4 relative z-10">

    <!-- View 1: Meals Calendar -->
    <section id="view-planner" class="space-y-4">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-bold uppercase tracking-wider text-neutral-500">Weekly Meal Board</h2>
        <span class="text-xs font-semibold text-amber-800 bg-amber-100/90 px-2.5 py-1 rounded-xl shadow-xs flex items-center gap-1">
          <span>🍲</span> Dinner rolls into lunch
        </span>
      </div>

      <div id="days-container" class="space-y-4">
        <!-- Rendered via JS -->
      </div>
    </section>

    <!-- View 2: Grocery List -->
    <section id="view-groceries" class="hidden space-y-4">
      <div class="bg-white border border-amber-200/80 rounded-3xl p-5 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-base font-bold text-neutral-900 flex items-center gap-2">
            <span>🛒</span> What do we need?
          </h2>
          <span id="grocery-count" class="text-xs font-bold bg-orange-100 text-orange-900 px-2.5 py-0.5 rounded-full">
            0/0 done
          </span>
        </div>
        <div class="flex gap-2">
          <input id="new-item-input" type="text" placeholder="Add an item..." 
                 class="flex-1 bg-neutral-50 border border-neutral-200 rounded-2xl px-4 py-3 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-amber-400/50 focus:bg-white transition" 
                 onkeydown="if(event.key === 'Enter') addCustomGroceryItem()"/>
          <button onclick="addCustomGroceryItem()" class="bg-amber-800 hover:bg-amber-900 text-white font-bold px-5 py-3 rounded-2xl text-sm shadow-sm transition active:scale-95">
            Add
          </button>
        </div>
      </div>

      <div id="grocery-items" class="space-y-2">
        <!-- Grocery items rendered via JS -->
      </div>
    </section>

    <!-- View 3: Events & Full Monthly Calendar -->
    <section id="view-events" class="hidden space-y-5">
      
      <!-- Month Calendar View -->
      <div class="bg-white border border-amber-200/80 rounded-3xl p-5 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm font-extrabold text-neutral-900 flex items-center gap-2">
            <span>📅</span> <span id="cal-month-title">Month</span>
          </h3>
          <div class="flex items-center space-x-1">
            <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-xl bg-neutral-100 hover:bg-neutral-200 text-neutral-700 flex items-center justify-center text-xs font-bold transition">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button onclick="changeMonth(1)" class="w-8 h-8 rounded-xl bg-neutral-100 hover:bg-neutral-200 text-neutral-700 flex items-center justify-center text-xs font-bold transition">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
        </div>

        <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-neutral-400 mb-2">
          <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center text-xs font-semibold">
          <!-- Calendar Days generated via JS -->
        </div>

        <div id="calendar-day-details" class="mt-4 pt-3 border-t border-neutral-100 text-xs hidden">
          <p class="font-bold text-neutral-800 mb-1.5" id="cal-selected-date-label">Selected Date</p>
          <div id="cal-selected-events" class="space-y-1.5"></div>
        </div>
      </div>

      <!-- Add Event Card -->
      <div class="bg-white border border-amber-200/80 rounded-3xl p-5 shadow-sm">
        <h2 class="text-base font-bold text-neutral-900 mb-3 flex items-center gap-2">
          <span>📌</span> Add an Event or Date
        </h2>
        <div class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] font-bold text-neutral-400 mb-1">Date</label>
              <input id="event-date-input" type="date" 
                     class="w-full bg-neutral-50 border border-neutral-200 rounded-2xl px-3 py-2 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-amber-400/50"/>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-neutral-400 mb-1">Time (Optional)</label>
              <input id="event-time-input" type="time" 
                     class="w-full bg-neutral-50 border border-neutral-200 rounded-2xl px-3 py-2 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-amber-400/50"/>
            </div>
          </div>

          <input id="event-title-input" type="text" placeholder="Add title or note..." 
                 class="w-full bg-neutral-50 border border-neutral-200 rounded-2xl px-4 py-3 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-amber-400/50 focus:bg-white" 
                 onkeydown="if(event.key === 'Enter') addEvent()"/>
          <button onclick="addEvent()" class="w-full bg-neutral-900 hover:bg-neutral-800 text-white font-bold py-3 rounded-2xl text-sm shadow-sm transition active:scale-98">
            Save to Calendar
          </button>
        </div>
      </div>

      <!-- Chronological Events Feed -->
      <div class="space-y-2">
        <h3 class="text-xs font-bold uppercase tracking-wider text-neutral-500 px-1">Upcoming Events</h3>
        <div id="events-list" class="space-y-2">
          <!-- Events rendered via JS -->
        </div>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-amber-100 py-2.5 px-4 shadow-[0_-4px_20px_rgba(0,0,0,0.03)]">
    <div class="max-w-md mx-auto grid grid-cols-3 gap-2">
      <button onclick="switchTab('planner')" id="tab-planner" class="flex flex-col items-center py-1.5 rounded-2xl text-amber-900 font-extrabold bg-amber-50">
        <i class="fa-solid fa-utensils text-base"></i>
        <span class="text-[11px] mt-1">Meals</span>
      </button>
      <button onclick="switchTab('groceries')" id="tab-groceries" class="flex flex-col items-center py-1.5 rounded-2xl text-neutral-400 font-semibold hover:text-neutral-700">
        <div class="relative">
          <i class="fa-solid fa-basket-shopping text-base"></i>
          <span id="grocery-badge" class="hidden absolute -top-1 -right-2.5 bg-amber-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
        </div>
        <span class="text-[11px] mt-1">Groceries</span>
      </button>
      <button onclick="switchTab('events')" id="tab-events" class="flex flex-col items-center py-1.5 rounded-2xl text-neutral-400 font-semibold hover:text-neutral-700">
        <i class="fa-regular fa-calendar-check text-base"></i>
        <span class="text-[11px] mt-1">Events</span>
      </button>
    </div>
  </nav>

  <script>
    const SUPABASE_URL = "https://xmtkbnrbhjoxsidxzeen.supabase.co";
    const SUPABASE_KEY = "sb_publishable_qgok2mtAMMIFaqBeZ3CVxA_y4MXPTN_";

    let sbClient = null;
    if (window.supabase && typeof window.supabase.createClient === 'function') {
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

    const DEFAULT_DATA = {
      days: {
        Monday: { breakfast: '', dinner: '', lunchOverride: '' },
        Tuesday: { breakfast: '', dinner: '', lunchOverride: '' },
        Wednesday: { breakfast: '', dinner: '', lunchOverride: '' },
        Thursday: { breakfast: '', dinner: '', lunchOverride: '' },
        Friday: { breakfast: '', dinner: '', lunchOverride: '' },
        Saturday: { breakfast: '', dinner: '', lunchOverride: '' },
        Sunday: { breakfast: '', dinner: '', lunchOverride: '' }
      },
      groceries: [],
      events: []
    };

    let state = JSON.parse(localStorage.getItem('at_hub_state')) || DEFAULT_DATA;
    let currentUser = localStorage.getItem('at_hub_user') || 'Tibor';
    let currentCalDate = new Date();

    const formatYMD = (d) => {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    setTimeout(() => {
      const dateEl = document.getElementById('event-date-input');
      if (dateEl) dateEl.value = formatYMD(new Date());
    }, 100);

    document.getElementById('active-user-label').innerText = currentUser;

    function toggleUser() {
      currentUser = (currentUser === 'Tibor') ? 'Anna' : 'Tibor';
      localStorage.setItem('at_hub_user', currentUser);
      document.getElementById('active-user-label').innerText = currentUser;
    }

    async function pushState() {
      localStorage.setItem('at_hub_state', JSON.stringify(state));
      render();

      if (sbClient) {
        document.getElementById('sync-status').innerText = "syncing...";
        document.getElementById('sync-dot').className = "relative inline-flex rounded-full h-3 w-3 bg-amber-500 animate-spin";
        try {
          const { error } = await sbClient
            .from('planner_state')
            .upsert({ id: 'active_week', data: state, updated_at: new Date() });
          
          if (!error) {
            document.getElementById('sync-status').innerText = "all synced up";
            document.getElementById('sync-dot').className = "relative inline-flex rounded-full h-3 w-3 bg-emerald-500";
          }
        } catch(e) {
          console.error(e);
        }
      }
    }

    async function initSupabaseSync() {
      if (!sbClient) return;

      try {
        const { data, error } = await sbClient
          .from('planner_state')
          .select('data')
          .eq('id', 'active_week')
          .single();

        if (data && data.data) {
          state = data.data;
          if (!state.events) state.events = [];
          localStorage.setItem('at_hub_state', JSON.stringify(state));
          render();
        }
      } catch(e) {
        console.error("Initial fetch error:", e);
      }

      sbClient
        .channel('public:planner_state')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'planner_state' }, payload => {
          if (payload.new && payload.new.data) {
            state = payload.new.data;
            if (!state.events) state.events = [];
            localStorage.setItem('at_hub_state', JSON.stringify(state));
            render();
          }
        })
        .subscribe();
    }

    function switchTab(tab) {
      ['planner', 'groceries', 'events'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = 'flex flex-col items-center py-1.5 rounded-2xl text-neutral-400 font-semibold';
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'flex flex-col items-center py-1.5 rounded-2xl text-amber-900 font-extrabold bg-amber-50';
    }

    function updateMeal(day, field, val) {
      if (!state.days[day]) state.days[day] = {};
      state.days[day][field] = val;
      pushState();
    }

    function addCustomGroceryItem() {
      const input = document.getElementById('new-item-input');
      const text = input.value.trim();
      if (!text) return;

      state.groceries.push({
        id: Date.now().toString(),
        name: text,
        source: `Added by ${currentUser}`,
        checked: false
      });
      input.value = '';
      pushState();
    }

    function toggleGrocery(id) {
      const item = state.groceries.find(g => g.id === id);
      if (item) {
        item.checked = !item.checked;
        pushState();
      }
    }

    function deleteGrocery(id) {
      state.groceries = state.groceries.filter(g => g.id !== id);
      pushState();
    }

    function addEvent() {
      const date = document.getElementById('event-date-input').value;
      const time = document.getElementById('event-time-input').value;
      const text = document.getElementById('event-title-input').value.trim();
      if (!text || !date) return;

      state.events.push({
        id: Date.now().toString(),
        date: date,
        time: time || '',
        title: text,
        author: currentUser
      });
      document.getElementById('event-title-input').value = '';
      document.getElementById('event-time-input').value = '';
      pushState();
    }

    function deleteEvent(id) {
      state.events = state.events.filter(e => e.id !== id);
      pushState();
    }

    function confirmResetWeek() {
      if (confirm("Reset this week's meals and lunch overrides? (Your calendar events will NOT be touched).")) {
        DAYS.forEach(d => {
          state.days[d] = { breakfast: '', dinner: '', lunchOverride: '' };
        });
        pushState();
      }
    }

    function getCurrentWeekDates() {
      const now = new Date();
      const currentDay = now.getDay();
      const distanceToMonday = (currentDay === 0 ? -6 : 1) - currentDay;
      const monday = new Date(now);
      monday.setDate(now.getDate() + distanceToMonday);

      const weekMap = {};
      DAYS.forEach((name, i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        weekMap[name] = formatYMD(d);
      });
      return weekMap;
    }

    function changeMonth(delta) {
      currentCalDate.setMonth(currentCalDate.getMonth() + delta);
      renderCalendar();
    }

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      const title = document.getElementById('cal-month-title');
      grid.innerHTML = '';

      const year = currentCalDate.getFullYear();
      const month = currentCalDate.getMonth();
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      title.innerText = `${monthNames[month]} ${year}`;

      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const startCol = (firstDayOfMonth === 0 ? 6 : firstDayOfMonth - 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < startCol; i++) {
        const blank = document.createElement('div');
        blank.className = "py-2 text-neutral-200";
        grid.appendChild(blank);
      }

      const today = new Date();

      for (let day = 1; day <= daysInMonth; day++) {
        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayEvents = (state.events || []).filter(e => e.date === dStr);
        const isToday = today.getDate() === day && today.getMonth() === month && today.getFullYear() === year;

        const cell = document.createElement('button');
        cell.className = `py-2 rounded-xl flex flex-col items-center justify-center transition active:scale-90 ${isToday ? 'bg-amber-800 text-white font-extrabold shadow-sm' : 'hover:bg-neutral-100 text-neutral-800'}`;
        cell.innerHTML = `
          <span>${day}</span>
          ${dayEvents.length > 0 ? `<span class="w-1.5 h-1.5 rounded-full ${isToday ? 'bg-amber-200' : 'bg-amber-600'} mt-0.5"></span>` : '<span class="w-1.5 h-1.5 mt-0.5"></span>'}
        `;

        cell.onclick = () => {
          const detail = document.getElementById('calendar-day-details');
          const label = document.getElementById('cal-selected-date-label');
          const evContainer = document.getElementById('cal-selected-events');
          detail.classList.remove('hidden');

          const clickedDate = new Date(year, month, day);
          const dayName = DAYS[clickedDate.getDay() === 0 ? 6 : clickedDate.getDay() - 1];
          label.innerText = `${dayName}, ${monthNames[month]} ${day}`;
          evContainer.innerHTML = '';

          if (dayEvents.length === 0) {
            evContainer.innerHTML = `<span class="text-neutral-400">No scheduled events.</span>`;
          } else {
            dayEvents.forEach(ev => {
              const div = document.createElement('div');
              div.className = "p-2 bg-neutral-50 rounded-xl border border-neutral-100 flex items-center justify-between";
              div.innerHTML = `
                <span class="font-bold text-neutral-800">${ev.time ? `🕒 ${ev.time} — ` : ''}${ev.title}</span>
                <span class="text-[10px] text-neutral-400">${ev.author}</span>
              `;
              evContainer.appendChild(div);
            });
          }
        };

        grid.appendChild(cell);
      }
    }

    function render() {
      const currentWeek = getCurrentWeekDates();

      // 1. Render Meal Days
      const daysContainer = document.getElementById('days-container');
      daysContainer.innerHTML = '';

      DAYS.forEach((day, index) => {
        const prevDay = index === 0 ? DAYS[6] : DAYS[index - 1];
        const dayData = state.days[day] || { breakfast: '', dinner: '', lunchOverride: '' };
        const prevDayDinner = (state.days[prevDay] && state.days[prevDay].dinner) ? state.days[prevDay].dinner : '';
        const lunchDisplay = dayData.lunchOverride || (prevDayDinner ? `Leftovers: ${prevDayDinner}` : 'No leftovers planned');

        const dayDateString = currentWeek[day];
        const thisDayEvents = (state.events || []).filter(e => e.date === dayDateString);

        const card = document.createElement('div');
        card.className = "bg-white border border-amber-200/70 rounded-3xl p-5 shadow-xs transition hover:shadow-sm";
        
        let eventsHtml = '';
        if (thisDayEvents.length > 0) {
          eventsHtml = `
            <div class="mb-3 space-y-1">
              ${thisDayEvents.map(ev => `
                <div class="flex items-center justify-between bg-sky-50 text-sky-900 border border-sky-100 px-3 py-1.5 rounded-xl text-xs font-bold">
                  <span class="flex items-center gap-1.5">
                    <span>${ev.time ? `🕒 ${ev.time}` : '📌'}</span>
                    <span>${ev.title}</span>
                  </span>
                  <span class="text-[10px] text-sky-600 font-semibold">${ev.author}</span>
                </div>
              `).join('')}
            </div>
          `;
        }

        card.innerHTML = `
          <div class="flex items-center justify-between mb-3 pb-2 border-b border-neutral-100">
            <span class="font-extrabold text-base text-neutral-900 tracking-tight flex items-center gap-1.5">
              <span>🗓️</span> ${day}
            </span>
            ${thisDayEvents.length > 0 ? `
              <span class="text-xs bg-sky-100 text-sky-800 font-bold px-2 py-0.5 rounded-full">
                ${thisDayEvents.length} this week
              </span>` : ''}
          </div>

          ${eventsHtml}

          <div class="space-y-3.5">
            <div>
              <label class="block text-xs font-bold text-neutral-500 uppercase tracking-wide mb-1 flex items-center gap-1.5">
                <span>🍳</span> Breakfast
              </label>
              <input type="text" value="${dayData.breakfast || ''}" 
                     placeholder="Breakfast..."
                     onchange="updateMeal('${day}', 'breakfast', this.value)"
                     class="w-full bg-[#fbf9f5] border border-neutral-200/90 rounded-2xl px-3.5 py-2.5 text-sm font-semibold text-neutral-800 placeholder:text-neutral-400 placeholder:font-normal focus:outline-none focus:ring-2 focus:ring-amber-400/50 focus:bg-white transition"/>
            </div>

            <div>
              <div class="flex items-center justify-between mb-1">
                <label class="block text-xs font-bold text-neutral-500 uppercase tracking-wide flex items-center gap-1.5">
                  <span>🍱</span> Lunch
                </label>
                <button onclick="let v = prompt('Override lunch for ${day}:', '${dayData.lunchOverride || ''}'); if(v !== null) updateMeal('${day}', 'lunchOverride', v);" class="text-xs font-bold text-amber-700 hover:text-amber-900 underline">
                  ${dayData.lunchOverride ? 'Edit' : 'Change'}
                </button>
              </div>
              <div class="bg-amber-50/70 border border-amber-200/60 rounded-2xl px-3.5 py-2.5 text-sm font-medium text-amber-900 flex items-center justify-between">
                <span>${lunchDisplay}</span>
                <span class="text-xs opacity-60">🥡</span>
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-neutral-500 uppercase tracking-wide mb-1 flex items-center gap-1.5">
                <span>🍷</span> Dinner
              </label>
              <input type="text" value="${dayData.dinner || ''}" 
                     placeholder="Dinner..."
                     onchange="updateMeal('${day}', 'dinner', this.value)"
                     class="w-full bg-[#fbf9f5] border border-neutral-200/90 rounded-2xl px-3.5 py-2.5 text-sm font-semibold text-neutral-800 placeholder:text-neutral-400 placeholder:font-normal focus:outline-none focus:ring-2 focus:ring-amber-400/50 focus:bg-white transition"/>
            </div>
          </div>
        `;
        daysContainer.appendChild(card);
      });

      // 2. Render Groceries
      const list = document.getElementById('grocery-items');
      list.innerHTML = '';
      const totalItems = state.groceries.length;
      const checkedItems = state.groceries.filter(g => g.checked).length;
      document.getElementById('grocery-count').innerText = `${checkedItems}/${totalItems} done`;

      const badge = document.getElementById('grocery-badge');
      const uncompleted = totalItems - checkedItems;
      if (uncompleted > 0) {
        badge.innerText = uncompleted;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      if (totalItems === 0) {
        list.innerHTML = `
          <div class="text-center py-12 bg-white rounded-3xl border border-dashed border-amber-200/80">
            <span class="text-3xl">🧺</span>
            <p class="text-sm font-bold text-neutral-600 mt-2">Fridge is all stocked!</p>
            <p class="text-xs text-neutral-400">Add items anytime above</p>
          </div>
        `;
      } else {
        state.groceries.forEach(item => {
          const row = document.createElement('div');
          row.className = `flex items-center justify-between p-3.5 rounded-2xl border transition ${item.checked ? 'bg-neutral-100/70 border-neutral-200 opacity-60' : 'bg-white border-amber-200/70 shadow-xs'}`;
          row.innerHTML = `
            <div class="flex items-center space-x-3 cursor-pointer select-none" onclick="toggleGrocery('${item.id}')">
              <div class="w-6 h-6 rounded-xl border flex items-center justify-center transition ${item.checked ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-neutral-300 bg-white'}">
                ${item.checked ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
              </div>
              <div>
                <p class="text-sm font-bold ${item.checked ? 'line-through text-neutral-400' : 'text-neutral-800'}">${item.name}</p>
                ${item.source ? `<span class="text-[10px] text-neutral-400 font-semibold">${item.source}</span>` : ''}
              </div>
            </div>
            <button onclick="deleteGrocery('${item.id}')" class="text-neutral-300 hover:text-rose-500 p-2 text-sm transition">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          `;
          list.appendChild(row);
        });
      }

      // 3. Render Events List
      const evList = document.getElementById('events-list');
      evList.innerHTML = '';
      const sortedEvents = [...(state.events || [])].sort((a, b) => (a.date || '').localeCompare(b.date || ''));

      if (sortedEvents.length === 0) {
        evList.innerHTML = `
          <div class="text-center py-10 bg-white rounded-3xl border border-dashed border-amber-200/80">
            <span class="text-3xl">☕</span>
            <p class="text-sm font-bold text-neutral-600 mt-2">No plans recorded yet</p>
            <p class="text-xs text-neutral-400">Select a date above to add an event</p>
          </div>
        `;
      } else {
        sortedEvents.forEach(ev => {
          const row = document.createElement('div');
          row.className = "flex items-center justify-between p-3.5 rounded-2xl bg-white border border-amber-200/70 shadow-xs";
          row.innerHTML = `
            <div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-extrabold text-amber-800 uppercase tracking-wider bg-amber-100/70 px-2 py-0.5 rounded-lg">${ev.date}</span>
                ${ev.time ? `<span class="text-xs font-bold text-sky-800 bg-sky-100 px-2 py-0.5 rounded-lg">🕒 ${ev.time}</span>` : ''}
              </div>
              <p class="text-sm font-bold text-neutral-800 mt-1.5">${ev.title}</p>
              <span class="text-[10px] font-semibold text-neutral-400">added by ${ev.author || 'Someone'}</span>
            </div>
            <button onclick="deleteEvent('${ev.id}')" class="text-neutral-300 hover:text-rose-500 p-2 text-sm transition">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          `;
          evList.appendChild(row);
        });
      }

      renderCalendar();
    }

    render();
    initSupabaseSync();
  </script>
</body>
</html>
